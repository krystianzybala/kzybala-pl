#!/usr/bin/env bash
# Evidence configuration: branch-prediction
# (docs/linux-evidence-runner.md). Correctness (the filtered sum for
# random5050/sorted/branchless must be IDENTICAL — a permutation-
# invariance oracle, not just a fixture to reproduce) is checked in
# @Setup before any timing, per variant, and re-verified by both
# languages' unit test suites before this runner ever executes.
# Java/JMH is the measured side for the runner (single pinned worker,
# no cross-thread coordination needed for this lab); the Rust/Criterion
# track is a separate instrument run locally (cargo bench /
# branch_evidence) and never merged into one ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/branch-prediction/code/java"
LAB_RUST_DIR="content/labs/branch-prediction/code/rust"
EV_SELECTOR="pl.kzybala.lab.branchprediction.BranchPredictionLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# Branch-prediction claims come from branches/branch-misses/IPC counters
# below — perf stat only, no cache-line-ownership evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,branches,branch-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <arrangement>-<dataset short code>
lab_variants() {
  local variants="" arrangement dataset
  for arrangement in biased random sorted branchless; do
    for dataset in byte int mixed; do
      variants="${variants} ${arrangement}-${dataset}"
    done
  done
  echo "$variants"
}

_bp_parts() { # <variant> -> "fullArrangement fullDataset"
  local v="$1"
  local arrangement="${v%%-*}"
  local dataset="${v#*-}"
  case "$arrangement" in
    biased) arrangement="biased9010" ;;
    random) arrangement="random5050" ;;
    sorted) arrangement="sorted" ;;
    branchless) arrangement="branchless" ;;
  esac
  case "$dataset" in
    byte) dataset="byteFlags" ;;
    int) dataset="intThresholds" ;;
    mixed) dataset="mixedHotCold" ;;
  esac
  echo "$arrangement $dataset"
}

lab_jmh_args() {
  read -r arrangement dataset <<<"$(_bp_parts "$1")"
  echo "-p variant=${arrangement} -p dataset=${dataset}"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
