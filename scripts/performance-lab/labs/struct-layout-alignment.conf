#!/usr/bin/env bash
# Evidence configuration: struct-layout-alignment
# (docs/linux-evidence-runner.md). Correctness (every layout variant
# must reproduce the IDENTICAL checksum for a given dataset) is checked
# in @Setup before any timing, per variant, and re-verified by both
# languages' unit test suites before this runner ever executes.
# Java/JMH is the measured side for the runner.
#
# This lab has TWO structurally different benchmark classes and the
# runner's EV_SELECTOR is a single constant, so only the sequential-
# access datasets (mixedPrimitiveRecord, headerPlusPayload — 10 of this
# lab's 15 conceptual cells) are wired into the automated batch here, via
# StructLayoutLinuxEvidenceBenchmark. producerConsumerCounters (the
# remaining 5 cells) measures two-thread THROUGHPUT via
# CounterLayoutLinuxEvidenceBenchmark, which is run manually per variant
# (benchmark.md's "Raw data and reproduction" section) — not because it
# is less important, but because @State(Scope.Group) two-thread
# throughput and @State(Scope.Benchmark) single-thread ns/record are not
# the same shape of measurement this runner's per-cell loop assumes.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/struct-layout-alignment/code/java"
LAB_RUST_DIR="content/labs/struct-layout-alignment/code/rust"
EV_SELECTOR="pl.kzybala.lab.structlayout.StructLayoutLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# Bytes/record come from JOL (producerConsumerCounters) and this lab's
# own hand-verified/repr(C)-cross-checked stride constants (mixed/
# header); perf stat contributes cache-misses/unaligned-load-adjacent
# counters (dTLB, cache-references) for the automated sequential cells.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,cache-references,cache-misses,LLC-loads,LLC-load-misses,dTLB-load-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in natural poor optimized aligned packed; do
    for dataset in mixed header; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

_sla_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    natural) variant="natural" ;;
    poor) variant="poorFieldOrder" ;;
    optimized) variant="optimizedFieldOrder" ;;
    aligned) variant="cacheLineAligned" ;;
    packed) variant="packedUnaligned" ;;
  esac
  case "$dataset" in
    mixed) dataset="mixedPrimitiveRecord" ;;
    header) dataset="headerPlusPayload" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  read -r variant dataset <<<"$(_sla_parts "$1")"
  echo "-p variant=${variant} -p dataset=${dataset}"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
