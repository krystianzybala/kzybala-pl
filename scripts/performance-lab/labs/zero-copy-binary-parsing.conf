#!/usr/bin/env bash
# Evidence configuration: zero-copy-binary-parsing
# (docs/linux-evidence-runner.md). Correctness (every decoder variant
# must reproduce the IDENTICAL checksum for a given dataset) is checked
# in @Setup before any timing, per variant, and re-verified by both
# languages' unit test suites before this runner ever executes.
# Java/JMH is the measured side for the runner.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/zero-copy-binary-parsing/code/java"
LAB_RUST_DIR="content/labs/zero-copy-binary-parsing/code/rust"
EV_SELECTOR="pl.kzybala.lab.zerocopy.ZeroCopyLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# B/message and bytes-copied come from JMH's -prof gc; perf stat
# contributes branch-misses (the copyingDecoder/objectBuildingDecoder
# vs. zero-copy-view access-pattern difference is partly a branch-
# predictability difference, not just an allocation one) and
# cache-misses context.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,branches,branch-misses,cache-references,cache-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in copying object viewed lazy mutate; do
    for dataset in fixed nested utf8; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

_zcp_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    copying) variant="copyingDecoder" ;;
    object) variant="objectBuildingDecoder" ;;
    viewed) variant="validatedZeroCopyView" ;;
    lazy) variant="lazyFieldDecode" ;;
    mutate) variant="mutableInPlaceUpdate" ;;
  esac
  case "$dataset" in
    fixed) dataset="fixedHeaderPlusVariablePayload" ;;
    nested) dataset="nestedRepeatedFields" ;;
    utf8) dataset="utf8Field" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  read -r variant dataset <<<"$(_zcp_parts "$1")"
  echo "-p variant=${variant} -p dataset=${dataset} -prof gc"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
