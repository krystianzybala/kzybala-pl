#!/usr/bin/env bash
# Evidence configuration: arena-lifetimes-reuse
# (docs/linux-evidence-runner.md). Correctness (every lifecycle variant
# must reproduce the IDENTICAL checksum for a given dataset) is checked
# in @Setup before any timing, per variant, and re-verified by both
# languages' unit test suites before this runner ever executes.
# Java/JMH is the measured side for the runner. EV_SELECTOR names the
# class only, so JMH runs BOTH @Benchmark methods for every (variant,
# dataset) cell: `fullPass` (AverageTime — B/op and allocations/op via
# -prof gc) and `oneBatchLatency` (SampleTime, overriding the class
# default — this lab's required p99 metric, from JMH's own percentile
# reporting, scoped to one batch so batchArena's reset/close cost is the
# dominant per-sample cost rather than being diluted across 1000
# batches).
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/arena-lifetimes-reuse/code/java"
LAB_RUST_DIR="content/labs/arena-lifetimes-reuse/code/rust"
EV_SELECTOR="pl.kzybala.lab.arenareuse.ArenaReuseLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# B/op and allocations/op come from JMH's -prof gc on `fullPass`;
# perf stat contributes cache-misses/context-switches context relevant
# to the pool variants' lock contention, even single-threaded.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,cache-references,cache-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in peritem arena threadlocal global bounded; do
    for dataset in messages trees buffers; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

_alr_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    peritem) variant="allocatePerItem" ;;
    arena) variant="batchArena" ;;
    threadlocal) variant="threadLocalReuse" ;;
    global) variant="globalPool" ;;
    bounded) variant="boundedPool" ;;
  esac
  case "$dataset" in
    messages) dataset="messageBatches" ;;
    trees) dataset="temporaryParseTrees" ;;
    buffers) dataset="scratchBuffers" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  read -r variant dataset <<<"$(_alr_parts "$1")"
  echo "-p variant=${variant} -p dataset=${dataset} -prof gc"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
