#!/usr/bin/env bash
# Evidence configuration: fixed-binary-serialization (docs/linux-evidence-runner.md).
# Correctness (round-trip equality + byte-for-byte wire compatibility
# between ByteBuffer and FFM for every dataset profile) is checked by
# both languages' test suites before this runner ever executes. This is a
# single-threaded, single-CPU benchmark (no contention/scaling axis) —
# the variant axis is purely codec-method x dataset-profile, selected via
# `-p profile=<profile> -e <exclusion of every other @Benchmark method>`,
# the same JMH-exclusion pattern branch-prediction.conf uses for its
# arrangement axis. Java/JMH is the measured side for the runner; the
# Rust/Criterion track is a separate instrument run locally (cargo bench)
# and never merged into one ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/fixed-binary-serialization/code/java"
LAB_RUST_DIR="content/labs/fixed-binary-serialization/code/rust"
EV_SELECTOR="pl.kzybala.lab.binser.BinSerBenchmark"
LAB_C2C_REQUIRED=0
# Encode/decode cost claims come from JMH ns/op plus JFR allocation
# evidence (see benchmark.md/exercises.md) — perf stat only, no
# cache-line-ownership evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_binser_methods() {
  echo "genericEncode genericDecode byteBufferEncode byteBufferDecode ffmEncode ffmDecode ffmDecodeFieldOnly"
}

_binser_profiles() {
  echo "smallCommand mediumEvent repeatedFields versionedOptionalField"
}

lab_variants() {
  local variants="" method profile
  for method in $(_binser_methods); do
    for profile in $(_binser_profiles); do
      variants="${variants} ${method}-${profile}"
    done
  done
  echo "$variants"
}

_binser_method() { # <variant> -> <@Benchmark method name>
  echo "${1%-*}"
}

_binser_profile() { # <variant> -> <profile>
  echo "${1##*-}"
}

_binser_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_binser_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  local method profile
  method="$(_binser_method "$1")"
  profile="$(_binser_profile "$1")"
  echo "-p profile=${profile} -e '\\.($(_binser_exclusions "$method"))\$'"
}

lab_threads() {
  echo "1"
}

lab_cpu_count() {
  echo "1"
}

# No worker-CPU pinning inside the kernels (the mechanism under test is
# encode/decode cost, not cache/NUMA placement) — worker-placement
# evidence is not-applicable for this lab, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
