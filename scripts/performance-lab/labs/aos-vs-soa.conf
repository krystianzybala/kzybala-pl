#!/usr/bin/env bash
# Evidence configuration: aos-vs-soa
# (docs/linux-evidence-runner.md). Layout-invariance (every layout of a
# dataset must reproduce the IDENTICAL hotSum and cold checksum — layout
# changes storage, never the data) is checked in @Setup before any
# timing, per variant, and re-verified by both languages' unit test
# suites before this runner ever executes. Java/JMH is the measured side
# for the runner (single pinned worker, no cross-thread coordination
# needed for this lab); the Rust/Criterion track is a separate instrument
# run locally (cargo bench / aos_soa_evidence) and never merged into one
# ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/aos-vs-soa/code/java"
LAB_RUST_DIR="content/labs/aos-vs-soa/code/rust"
EV_SELECTOR="pl.kzybala.lab.aosvssoa.AosVsSoaLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# Density/cache-miss claims come from cache-references/cache-misses/LLC
# counters below — perf stat only, no cache-line-ownership evidence
# needed (this lab is about density, not coherence).
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,cache-references,cache-misses,LLC-loads,LLC-load-misses,dTLB-load-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <layout>-<dataset short code>
lab_variants() {
  local variants="" layout dataset
  for layout in aosheap aospacked soa hybrid; do
    for dataset in quotes positions points; do
      variants="${variants} ${layout}-${dataset}"
    done
  done
  echo "$variants"
}

_avs_parts() { # <variant> -> "fullLayout fullDataset"
  local v="$1"
  local layout="${v%%-*}"
  local dataset="${v#*-}"
  case "$layout" in
    aosheap) layout="aosHeap" ;;
    aospacked) layout="aosPacked" ;;
    soa) layout="soa" ;;
    hybrid) layout="hybrid" ;;
  esac
  case "$dataset" in
    quotes) dataset="marketQuotes" ;;
    positions) dataset="positions" ;;
    points) dataset="spatialPoints" ;;
  esac
  echo "$layout $dataset"
}

lab_jmh_args() {
  read -r layout dataset <<<"$(_avs_parts "$1")"
  echo "-p variant=${layout} -p dataset=${dataset}"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
