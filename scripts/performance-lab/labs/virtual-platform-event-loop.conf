#!/usr/bin/env bash
# Evidence configuration: virtual-platform-event-loop (docs/linux-evidence-runner.md).
# Correctness (exact checksum/completed-count total for every variant x
# dataset pair) is checked by both languages' test suites before this
# runner ever executes. Java/JMH (one class, VpeBenchmark, one exclusion
# per benchmark method) is the measured side for the runner; the
# Rust/Criterion track (thread_per_request/high_fanout_os_threads are a
# documented, non-comparable pair — see theory.md) is a separate
# instrument run locally (cargo bench) and never merged into one ranking
# with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_quad"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
# Exact cardinality: the CPU-bound pool and mixed variants size their
# worker pool to availableProcessors(); reserve 4 cores for a stable,
# reproducible pool size on the publication host (matches the
# thread-per-core-sharding/locks-spin-parking sibling labs' convention).
LAB_CPUS_EXACT=4
LAB_MIN_CPUS=4
LAB_JAVA_DIR="content/labs/virtual-platform-event-loop/code/java"
LAB_RUST_DIR="content/labs/virtual-platform-event-loop/code/rust"
EV_SELECTOR="pl.kzybala.lab.vpe.VpeBenchmark"
LAB_C2C_REQUIRED=0
# This lab's mechanism is scheduling/carrier-occupancy cost, not
# cache-line ownership — perf-stat/JFR territory, no c2c evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_vpe_all_methods() {
  echo "platformPerRequest_socketWait virtualPerTask_socketWait fixedEventLoop_socketWait cpuBoundPool_shortCpu fixedEventLoop_longCpu mixed_socketWait"
}

lab_variants() {
  _vpe_all_methods
}

_vpe_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_vpe_all_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  echo "-e '\\.($(_vpe_exclusions "$1"))\$'"
}

lab_threads() {
  echo 4
}

lab_cpu_count() {
  echo 4
}

# No explicit worker-CPU pinning inside these kernels (the mechanism under
# test is scheduling-model cost, not cache/NUMA placement) — CPUs are
# reserved by the runner for isolation, not consumed via -Dplab.cpu*
# properties the benchmark itself reads. Worker-placement evidence is
# therefore not-applicable for this lab, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
