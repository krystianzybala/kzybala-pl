#!/usr/bin/env bash
# Evidence configuration: memory-ordering-atomics
# (docs/linux-evidence-runner.md). Correctness (zero forbidden outcomes
# for the four "correct" variants per dataset, exact expected totals for
# the counter dataset's non-trap variants) is checked by both languages'
# stress-trial suites before this runner ever executes; deliberately weak
# variants (plain/broken publication, the counter dataset's
# volatile/seq-cst trap) are excluded from the measured set entirely —
# this lab never benchmarks a variant its own correctness suite does not
# gate on (see benchmark.md's Method section).
# Java/JMH (one class, MemOrdBenchmark, one @Benchmark method per
# variant) is the measured side for the runner; the Rust/Criterion track
# is a separate instrument run locally (cargo bench) and never merged
# into one ranking with JMH — the two languages' operation definitions
# both include real thread spawn/join per sample (see benchmark.md), so
# this is not the same non-comparability shape as a persistent-thread lab.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_quad"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
# Exact cardinality: the counter-update dataset spawns exactly
# COUNTER_THREAD_COUNT=4 worker threads; mailbox/sequence-flag variants
# only need 2 but never more than the lab-wide maximum is available.
LAB_CPUS_EXACT=4
LAB_MIN_CPUS=4
LAB_JAVA_DIR="content/labs/memory-ordering-atomics/code/java"
LAB_RUST_DIR="content/labs/memory-ordering-atomics/code/rust"
EV_SELECTOR="pl.kzybala.lab.memord.MemOrdBenchmark"
LAB_C2C_REQUIRED=0
# Ordering-strength cost is a per-op JMH/perf-stat question here — no
# cache-line-ownership/HITM evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

lab_variants() {
  echo "mailbox-acquireRelease mailbox-volatileSeqCst mailbox-casLoop mailbox-fenceBased seqFlag-acquireRelease seqFlag-volatileSeqCst seqFlag-casLoop seqFlag-fenceBased counter-acquireRelease counter-casLoop counter-fenceBased"
}

_moa_all_methods() {
  echo "mailbox_acquireRelease mailbox_volatileSeqCst mailbox_casLoop mailbox_fenceBased seqFlag_acquireRelease seqFlag_volatileSeqCst seqFlag_casLoop seqFlag_fenceBased counter_acquireRelease counter_casLoop counter_fenceBased"
}

_moa_method() { # <variant, hyphenated> -> <@Benchmark method name>
  echo "${1/-/_}"
}

_moa_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_moa_all_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  echo "-e '\\.($(_moa_exclusions "$(_moa_method "$1")"))\$'"
}

lab_threads() {
  case "$1" in
    counter-*) echo 4 ;;
    *) echo 2 ;;
  esac
}

lab_cpu_count() {
  case "$1" in
    counter-*) echo 4 ;;
    *) echo 2 ;;
  esac
}

# No explicit worker-CPU pinning inside these kernels (the mechanism under
# test is publication ordering, not cache/NUMA placement) — CPUs are
# reserved by the runner for isolation, not consumed via -Dplab.cpu*
# properties the benchmark itself reads. Worker-placement evidence is
# therefore not-applicable for this lab, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
