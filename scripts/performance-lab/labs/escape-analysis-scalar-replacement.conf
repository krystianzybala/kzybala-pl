#!/usr/bin/env bash
# Evidence configuration: escape-analysis-scalar-replacement
# (docs/linux-evidence-runner.md). All five variants must sum to the
# IDENTICAL total for a given dataset — checked in @Setup before any
# timing, and re-verified by both languages' unit test suites before
# this runner ever executes. Java/JMH is the measured side for the
# runner (with -prof gc as the primary allocation-elimination evidence);
# the Rust/Criterion track is a separate instrument run locally and
# never merged into one ranking with JMH — none of Rust's five matrix
# variants allocate at all (rust.md), which is itself the point, not a
# comparability gap to paper over.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/escape-analysis-scalar-replacement/code/java"
LAB_RUST_DIR="content/labs/escape-analysis-scalar-replacement/code/rust"
EV_SELECTOR="pl.kzybala.lab.escapeanalysis.EscapeAnalysisLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# Allocation-elimination claims come primarily from JMH's -prof gc
# (B/op, GC events — added per-variant by the runner alongside perf
# stat); perf stat itself contributes instructions/cycles/page-faults
# context for the materialized variants' real allocator+GC cost.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,branches,branch-misses,cache-references,cache-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in nonesc returned stored opaque identity; do
    for dataset in coord result parser; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

_eas_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    nonesc) variant="nonEscaping" ;;
    returned) variant="returnedObject" ;;
    stored) variant="storedIntoField" ;;
    opaque) variant="passedToOpaqueCall" ;;
    identity) variant="identityObserved" ;;
  esac
  case "$dataset" in
    coord) dataset="coordinate" ;;
    result) dataset="resultWrapper" ;;
    parser) dataset="parserState" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  read -r variant dataset <<<"$(_eas_parts "$1")"
  echo "-p variant=${variant} -p dataset=${dataset} -prof gc"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
