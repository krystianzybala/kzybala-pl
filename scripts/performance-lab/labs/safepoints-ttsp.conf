#!/usr/bin/env bash
# Evidence configuration: safepoints-ttsp
# (docs/linux-evidence-runner.md). Real, multi-threaded stop-the-world
# coordination — JMH's throughput/avgtime modes have no way to represent
# this, so every variant here is kind=aux, running SafepointHarness
# directly. TTSP/operation/resume are measured from the JVM's own JFR
# safepoint events (jdk.SafepointBegin/ExecuteVMOperation/SafepointEnd
# correlated by safepointId — java.md), never estimated from a wall-clock
# delta. The threadFleet dataset genuinely needs multiple cores to be a
# meaningful demonstration of per-thread coordination cost, hence
# core_quad rather than core_single. Java is the measured side for the
# runner; the Rust track builds its own explicit stop-the-world
# coordinator locally and is expected to show a structurally different
# cost model (rust.md), never "no pauses at all".
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_quad"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=4
LAB_MIN_CPUS=4
LAB_JAVA_DIR="content/labs/safepoints-ttsp/code/java"
LAB_RUST_DIR="content/labs/safepoints-ttsp/code/rust"
EV_SELECTOR="pl.kzybala.lab.safepoints.SafepointHarness"
LAB_C2C_REQUIRED=0
# TTSP/operation/resume come from the harness's own JFR-derived episode
# report; perf stat contributes aggregate instructions/cycles/context
# for the run as a whole.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,branches,branch-misses,cache-references,cache-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in coop sparse native idle allocpress; do
    for dataset in numeric nativesleep fleet; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

lab_variant_kind() {
  echo "aux"
}

_stp_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    coop) variant="cooperativeLoop" ;;
    sparse) variant="longLoopSparsePolls" ;;
    native) variant="threadInNativeCall" ;;
    idle) variant="manyIdleThreads" ;;
    allocpress) variant="allocationPressureTrigger" ;;
  esac
  case "$dataset" in
    numeric) dataset="numericLoop" ;;
    nativesleep) dataset="nativeSleepDowncall" ;;
    fleet) dataset="threadFleet" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  echo ""
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 4
}

lab_worker_props() {
  read -r variant dataset <<<"$(_stp_parts "$1")"
  # longLoopSparsePolls differs from cooperativeLoop ONLY by this launch
  # flag — identical Java code, a real JVM-level mechanism difference.
  if [ "$variant" = "longLoopSparsePolls" ]; then
    echo "-XX:-UseCountedLoopSafepoints -Dplab.cpuA=${CPU_LIST[0]}"
  else
    echo "-Dplab.cpuA=${CPU_LIST[0]}"
  fi
}

lab_aux_evidence_cmd() {
  read -r variant dataset <<<"$(_stp_parts "$1")"
  local xxflag=""
  [ "$variant" = "longLoopSparsePolls" ] && xxflag="-XX:-UseCountedLoopSafepoints"
  echo "java -Xms1g -Xmx1g -XX:+UseSerialGC ${xxflag} -cp target/benchmarks.jar pl.kzybala.lab.safepoints.SafepointHarness --variant ${variant} --dataset ${dataset}"
}

lab_rust_evidence_cmd() {
  echo ""
}
