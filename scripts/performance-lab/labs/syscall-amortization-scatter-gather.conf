#!/usr/bin/env bash
# Evidence configuration: syscall-amortization-scatter-gather
# (docs/linux-evidence-runner.md). Correctness (full delivery, expected
# write-call counts per variant, correct behavior under induced
# backpressure/partial writes) is checked by both languages' test suites
# before this runner ever executes. Single-threaded, single-CPU JMH
# benchmark process (the receiver runs on a background thread within the
# same process, not a separate process). Java/JMH is the measured side
# for the runner; the Rust/Criterion track is a separate instrument run
# locally (cargo bench) and never merged into one ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/syscall-amortization-scatter-gather/code/java"
LAB_RUST_DIR="content/labs/syscall-amortization-scatter-gather/code/rust"
EV_SELECTOR="pl.kzybala.lab.syscallamort.SyscallAmortBenchmark"
LAB_C2C_REQUIRED=0
# Syscalls/message claims come from the custom socket harness's own
# write-call accounting plus strace summary evidence where available
# (see exercises.md) — perf stat only, no cache-line-ownership evidence
# needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_syscallamort_methods() {
  echo "singleSmallWrite coalescedBuffer scatterGatherWrite sizeBoundedBatch"
}

_syscallamort_profiles() {
  echo "headerPlusPayload smallMessages mixedSizes"
}

lab_variants() {
  local variants="" method profile
  for method in $(_syscallamort_methods); do
    for profile in $(_syscallamort_profiles); do
      variants="${variants} ${method}-${profile}"
    done
  done
  echo "$variants"
}

_syscallamort_method() { # <variant> -> <@Benchmark method name>
  echo "${1%-*}"
}

_syscallamort_profile() { # <variant> -> <profile>
  echo "${1##*-}"
}

_syscallamort_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_syscallamort_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  local method profile
  method="$(_syscallamort_method "$1")"
  profile="$(_syscallamort_profile "$1")"
  echo "-p profile=${profile} -e '\\.($(_syscallamort_exclusions "$method"))\$'"
}

lab_threads() {
  echo "1"
}

lab_cpu_count() {
  echo "1"
}

# No worker-CPU pinning inside the kernels — worker-placement evidence is
# not-applicable for this lab, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
