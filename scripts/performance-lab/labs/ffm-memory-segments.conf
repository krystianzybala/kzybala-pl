#!/usr/bin/env bash
# Evidence configuration: ffm-memory-segments
# (docs/linux-evidence-runner.md). Correctness (every storage variant
# must reproduce the IDENTICAL checksum for a given dataset) is checked
# in @Setup before any timing, per variant, and re-verified by both
# languages' unit test suites before this runner ever executes.
# Java/JMH is the measured side for the runner (single pinned worker, no
# cross-thread coordination needed for this lab — confined vs shared is
# about arena kind, not concurrent access); the Rust/Criterion track
# (plus the ffm_memory_segments_evidence binary) is a separate instrument
# run locally and never merged into one ranking with JMH. EV_SELECTOR
# names the class only, so JMH runs BOTH @Benchmark methods
# (sequentialSum, randomAccess) for every (variant, dataset) cell —
# ns/record and ns/access are two distinct required metrics.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/ffm-memory-segments/code/java"
LAB_RUST_DIR="content/labs/ffm-memory-segments/code/rust"
EV_SELECTOR="pl.kzybala.lab.ffmsegments.FfmMemorySegmentsLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# Allocation rate and copy bytes come from JMH's -prof gc, primarily
# relevant to the copiedBoundaryCrossing variant; perf stat contributes
# cache-misses/page-faults context for every variant.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,cache-references,cache-misses,LLC-loads,LLC-load-misses,dTLB-load-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in heap confined shared sliced copied; do
    for dataset in fixed large frames; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

_ffm_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    heap) variant="heapPrimitiveArray" ;;
    confined) variant="confinedSegment" ;;
    shared) variant="sharedSegment" ;;
    sliced) variant="slicedView" ;;
    copied) variant="copiedBoundaryCrossing" ;;
  esac
  case "$dataset" in
    fixed) dataset="fixedRecords" ;;
    large) dataset="largeNumericBuffers" ;;
    frames) dataset="binaryFrames" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  read -r variant dataset <<<"$(_ffm_parts "$1")"
  echo "-p variant=${variant} -p dataset=${dataset} -prof gc"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
