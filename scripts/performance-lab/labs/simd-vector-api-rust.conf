#!/usr/bin/env bash
# Evidence configuration: simd-vector-api-rust
# (docs/linux-evidence-runner.md). Correctness (every variant must
# reproduce the IDENTICAL result for a given dataset) is checked in
# @Setup before any timing, per variant, and re-verified by both
# languages' unit test suites before this runner ever executes.
# Java/JMH is the measured side for the runner. jdk.incubator.vector is
# an INCUBATING JDK module — every JVM invocation (including JMH's
# forked child process, via @Fork's jvmArgsAppend) needs
# --add-modules jdk.incubator.vector explicitly.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/simd-vector-api-rust/code/java"
LAB_RUST_DIR="content/labs/simd-vector-api-rust/code/rust"
EV_SELECTOR="pl.kzybala.lab.simd.SimdLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# Vector instructions and cycles/element come from perf stat; this lab's
# "benchmarking unsupported CPU features" trap means the runner must
# record the measured host's actual microarchitecture and preferred
# vector width explicitly, never assume AVX2/AVX-512 availability.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,branches,branch-misses,cache-references,cache-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in scalar autovec explicit misaligned smalltail; do
    for dataset in summinmax threshold dot bytes; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

_simd_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    scalar) variant="scalarBaseline" ;;
    autovec) variant="autoVectorizedCandidate" ;;
    explicit) variant="explicitSimd" ;;
    misaligned) variant="misalignedInput" ;;
    smalltail) variant="smallTailHeavyInput" ;;
  esac
  case "$dataset" in
    summinmax) dataset="sumMinMax" ;;
    threshold) dataset="thresholdFilter" ;;
    dot) dataset="dotProduct" ;;
    bytes) dataset="byteClassification" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  read -r variant dataset <<<"$(_simd_parts "$1")"
  echo "-p variant=${variant} -p dataset=${dataset} --add-modules jdk.incubator.vector"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
