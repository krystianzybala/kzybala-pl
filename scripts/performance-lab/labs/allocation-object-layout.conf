#!/usr/bin/env bash
# Evidence configuration: allocation-object-layout
# (docs/linux-evidence-runner.md). Correctness (every representation
# variant must reproduce the IDENTICAL checksum for a given dataset) is
# checked in @Setup before any timing, per variant, and re-verified by
# both languages' unit test suites before this runner ever executes.
# Java/JMH is the measured side for the runner (single pinned worker, no
# cross-thread coordination needed for this lab); the Rust/Criterion
# track (plus the allocation_object_layout_evidence binary) is a separate
# instrument run locally and never merged into one ranking with JMH.
# EV_SELECTOR names the class only, so JMH runs BOTH @Benchmark methods
# (construct, sumHot) for every (variant, dataset) cell — this lab's
# metrics need both: construction ns/record from `construct`, read-back
# cost from `sumHot`.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/allocation-object-layout/code/java"
LAB_RUST_DIR="content/labs/allocation-object-layout/code/rust"
EV_SELECTOR="pl.kzybala.lab.objectlayout.AllocationObjectLayoutLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# B/op and allocation rate come from JMH's -prof gc on the `construct`
# benchmark specifically (where allocation happens); perf stat
# contributes cache-misses/page-faults context for both benchmarks.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,cache-references,cache-misses,LLC-loads,LLC-load-misses,dTLB-load-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in boxed flat packed reused; do
    for dataset in orders tree tuples; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

_aol_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    boxed) variant="boxedObjectGraph" ;;
    flat) variant="flatPrimitiveArrays" ;;
    packed) variant="packedOffHeapStruct" ;;
    reused) variant="reusedMutableHolder" ;;
  esac
  case "$dataset" in
    orders) dataset="ordersQuotes" ;;
    tree) dataset="treeNodes" ;;
    tuples) dataset="smallTuples" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  read -r variant dataset <<<"$(_aol_parts "$1")"
  echo "-p variant=${variant} -p dataset=${dataset} -prof gc"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
