#!/usr/bin/env bash
# Evidence configuration: inlining-call-site-shape
# (docs/linux-evidence-runner.md). Two pairwise equalities are the
# correctness oracle: monomorphic==oversizedCallee (same logical
# strategy, different code size) and megamorphic==switchDispatch (same
# six-way round-robin, different dispatch mechanism) — checked in
# @Setup before any timing, and re-verified by both languages' unit test
# suites before this runner ever executes. Java/JMH is the measured side
# for the runner; the Rust/Criterion track is a separate instrument run
# locally and never merged into one ranking with JMH (rust.md documents
# why Rust's dyn-dispatch numbers are not expected to mirror Java's
# inlining-driven curve).
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/inlining-call-site-shape/code/java"
LAB_RUST_DIR="content/labs/inlining-call-site-shape/code/rust"
EV_SELECTOR="pl.kzybala.lab.inlining.InliningLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# Dispatch-mechanism claims come from branches/instructions/IPC counters
# below (indirect-call/vtable overhead shows up as branch and cycle
# cost) — perf stat only, no cache-line-ownership evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,branches,branch-misses,cache-references,cache-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in mono bi mega switchd oversized; do
    for dataset in pricing codec validation; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

_icss_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    mono) variant="monomorphic" ;;
    bi) variant="bimorphic" ;;
    mega) variant="megamorphic" ;;
    switchd) variant="switchDispatch" ;;
    oversized) variant="oversizedCallee" ;;
  esac
  case "$dataset" in
    pricing) dataset="pricingFunctions" ;;
    codec) dataset="codecStrategies" ;;
    validation) dataset="validationRules" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  read -r variant dataset <<<"$(_icss_parts "$1")"
  echo "-p variant=${variant} -p dataset=${dataset}"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
