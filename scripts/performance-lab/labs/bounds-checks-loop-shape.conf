#!/usr/bin/env bash
# Evidence configuration: bounds-checks-loop-shape
# (docs/linux-evidence-runner.md). Every dataset's payload is
# backing[i]=i; every variant on a given dataset must sum to the
# IDENTICAL closed-form total (n*(n-1)/2-derived) — loop shape and
# check-elimination eligibility change cost, never the result. Checked
# in @Setup before any timing, per (variant, dataset) cell, and
# re-verified by both languages' unit test suites before this runner
# ever executes. Java/JMH is the measured side for the runner; the
# Rust/Criterion track is a separate instrument run locally and never
# merged into one ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/bounds-checks-loop-shape/code/java"
LAB_RUST_DIR="content/labs/bounds-checks-loop-shape/code/rust"
EV_SELECTOR="pl.kzybala.lab.boundschecks.BoundsChecksLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# Bounds-check-elimination claims come from branches/instructions/IPC
# counters below; irregularIndex additionally benefits from the
# cache-miss counters already established in cache-locality-working-set's
# conf — perf stat only, no cache-line-ownership evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,branches,branch-misses,cache-references,cache-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in canon opaque irregular safeiter unchecked; do
    for dataset in prim slice strided; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

_bc_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    canon) variant="canonical" ;;
    opaque) variant="opaqueLimit" ;;
    irregular) variant="irregularIndex" ;;
    safeiter) variant="safeIterator" ;;
    unchecked) variant="unchecked" ;;
  esac
  case "$dataset" in
    prim) dataset="primitiveArrays" ;;
    slice) dataset="slicesSubranges" ;;
    strided) dataset="stridedAccess" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  read -r variant dataset <<<"$(_bc_parts "$1")"
  echo "-p variant=${variant} -p dataset=${dataset}"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
