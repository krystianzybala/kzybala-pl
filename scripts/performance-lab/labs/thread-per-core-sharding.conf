#!/usr/bin/env bash
# Evidence configuration: thread-per-core-sharding
# (docs/linux-evidence-runner.md). Correctness (exact expected per-key
# count under each dataset, for every mechanism) is checked by both
# languages' test suites before this runner ever executes.
# Java/JMH (one class, TpcBenchmark, one exclusion per variant method) is
# the measured side for the runner; the Rust/Criterion track is a
# separate instrument run locally (cargo bench) and never merged into
# one ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_octet"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
# Exact cardinality: the single-writer and rebalance variants run
# SHARD_COUNT=4 owner threads plus REQUESTER_THREADS=4 requester threads
# concurrently (8 total) — the largest concurrency this lab's matrix
# needs; shared-map/mutex-shards variants use a deterministic prefix of 4.
LAB_CPUS_EXACT=8
LAB_MIN_CPUS=8
LAB_JAVA_DIR="content/labs/thread-per-core-sharding/code/java"
LAB_RUST_DIR="content/labs/thread-per-core-sharding/code/rust"
EV_SELECTOR="pl.kzybala.lab.tpc.TpcBenchmark"
LAB_C2C_REQUIRED=0
# Sharding/routing cost is a perf-stat question (throughput, queue depth
# proxies, CAS/lock counts) here — no cache-line-ownership evidence
# needed for the correctness-suite dataset this lab wires.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_tpc_all_methods() {
  echo "sharedMapUniform sharedMapSkewed mutexShardsUniform mutexShardsSkewed singleWriterUniform singleWriterSkewed rebalanceSimulation"
}

lab_variants() {
  _tpc_all_methods
}

_tpc_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_tpc_all_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  echo "-e '\\.($(_tpc_exclusions "$1"))\$'"
}

lab_threads() {
  case "$1" in
    singleWriter*|rebalanceSimulation) echo 8 ;;
    *) echo 4 ;;
  esac
}

lab_cpu_count() {
  lab_threads "$1"
}

# No explicit worker-CPU pinning inside these kernels (the mechanism
# under test is ownership partitioning and routing cost, not cache/NUMA
# placement) — CPUs are reserved by the runner for isolation, not
# consumed via -Dplab.cpu* properties the benchmark itself reads.
# Worker-placement evidence is therefore not-applicable for this lab,
# not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
