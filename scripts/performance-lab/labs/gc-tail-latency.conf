#!/usr/bin/env bash
# Evidence configuration: gc-tail-latency
# (docs/linux-evidence-runner.md). Pause p50/p99/p999, GC count and live
# set come from the JVM's own JFR GC events (jdk.GarbageCollection's
# duration, jdk.GCHeapSummary's heapUsed "After GC" — java.md), never
# estimated from a wall-clock delta around the workload call. JMH's
# throughput/avgtime modes have no way to represent a percentile-pause
# distribution across a whole run, so every variant here is kind=aux,
# running GcTailHarness directly (the same design as
# content/labs/safepoints-ttsp). The colg1/colpar variants run the
# IDENTICAL Java code as steady — only the launching JVM's collector flag
# differs. Heap sizing (512m fixed, every variant) is deliberately not
# tiny — "tiny heaps chosen to manufacture pauses" is a named trap this
# lab must avoid, not lean on for a dramatic chart. Java is the measured
# side for the runner; the Rust track has no collector to select and
# measures a structurally different mechanism instead — allocator latency
# and one synchronous reclamation event, never a GC pause distribution
# (rust.md).
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/gc-tail-latency/code/java"
LAB_RUST_DIR="content/labs/gc-tail-latency/code/rust"
EV_SELECTOR="pl.kzybala.lab.gctail.GcTailHarness"
LAB_C2C_REQUIRED=0
# Pause percentiles, GC count and live set come from the harness's own
# JFR-derived report; perf stat contributes aggregate
# instructions/cycles/page-faults context for the run as a whole.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,branches,branch-misses,cache-references,cache-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in low steady bursty growing colg1 colpar; do
    for dataset in churn pipeline cache; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

lab_variant_kind() {
  echo "aux"
}

_gtl_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    low) variant="lowAllocationReuse" ;;
    steady) variant="steadyHighAllocation" ;;
    bursty) variant="burstyAllocation" ;;
    growing) variant="growingLiveSet" ;;
    colg1) variant="collectorMatrix" ;;
    colpar) variant="collectorMatrix" ;;
  esac
  case "$dataset" in
    churn) dataset="objectGraphChurn" ;;
    pipeline) dataset="messagePipeline" ;;
    cache) dataset="retainedCache" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  echo ""
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  local short="$1"
  local collector="-XX:+UseG1GC"
  case "$short" in
    colpar-*) collector="-XX:+UseParallelGC" ;;
  esac
  echo "-Xms512m -Xmx512m ${collector} -Dplab.cpuA=${CPU_LIST[0]}"
}

lab_aux_evidence_cmd() {
  read -r variant dataset <<<"$(_gtl_parts "$1")"
  local collector="-XX:+UseG1GC"
  case "$1" in
    colpar-*) collector="-XX:+UseParallelGC" ;;
  esac
  echo "java -Xms512m -Xmx512m ${collector} -cp target/benchmarks.jar pl.kzybala.lab.gctail.GcTailHarness --variant ${variant} --dataset ${dataset}"
}

lab_rust_evidence_cmd() {
  echo ""
}
