#!/usr/bin/env bash
# Evidence configuration: coordinated-omission-load-generation
# (docs/linux-evidence-runner.md). Correctness (admitted+missed==produced,
# closed-loop response-time==service-time invariant, omission-correction
# sample counts) is checked by both languages' test suites before this
# runner ever executes. Java/JMH (one class, CoLoadBenchmark, one
# exclusion per benchmark method) is the measured side for the runner;
# the Rust/Criterion track is a separate instrument run locally (cargo
# bench) and never merged into one ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
# The simulator is single-threaded by construction (a deterministic
# discrete-event recurrence on a virtual clock) — one reserved core is
# sufficient for isolation.
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/coordinated-omission-load-generation/code/java"
LAB_RUST_DIR="content/labs/coordinated-omission-load-generation/code/rust"
EV_SELECTOR="pl.kzybala.lab.coload.CoLoadBenchmark"
LAB_C2C_REQUIRED=0
# This lab's mechanism is measurement-methodology CPU cost, not
# cache-line ownership — perf-stat territory, no c2c evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_coload_all_methods() {
  echo "closedLoop openLoopFixedRate poissonLikeArrivals omissionCorrectedRecording burstSchedule openLoopUnderSustainedOverload"
}

lab_variants() {
  _coload_all_methods
}

_coload_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_coload_all_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  echo "-e '\\.($(_coload_exclusions "$1"))\$'"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

# No explicit worker-CPU pinning inside these kernels (a single-threaded
# virtual-clock simulation) — CPUs are reserved by the runner for
# isolation, not consumed via -Dplab.cpu* properties the benchmark itself
# reads. Worker-placement evidence is therefore not-applicable for this
# lab, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
