#!/usr/bin/env bash
# Evidence configuration: java-rust-ffm-interop (docs/linux-evidence-runner.md).
# Correctness (all four transform variants agreeing byte-for-byte, record
# validation counting corrupted records correctly, in-order upcall
# delivery) is checked by both languages' test suites — including real
# downcalls/upcalls into the compiled Rust cdylib — before this runner
# ever executes. Single-threaded, single-CPU JMH benchmark process.
# Java/JMH is the measured side for the runner; the Rust/Criterion
# "pure Rust baseline" track is a separate instrument run locally (cargo
# bench) and never merged into one ranking with JMH (this lab's own
# non-goal: no Java-versus-Rust winner).
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/java-rust-ffm-interop/code/java"
LAB_RUST_DIR="content/labs/java-rust-ffm-interop/code/rust"
EV_SELECTOR="pl.kzybala.lab.ffminterop.FfmInteropBenchmark"
LAB_C2C_REQUIRED=0
# ns/call and callback-latency claims come from JMH plus JFR method
# profiling (see exercises.md) — perf stat only, no cache-line-ownership
# evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_ffminterop_methods() {
  echo "pureJavaBaseline scalarDowncallPerItem batchedDowncall zeroCopyBufferDowncall rustToJavaUpcall"
}

lab_variants() {
  _ffminterop_methods
}

_ffminterop_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_ffminterop_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  echo "-e '\\.($(_ffminterop_exclusions "$1"))\$'"
}

lab_threads() {
  echo "1"
}

lab_cpu_count() {
  echo "1"
}

# No worker-CPU pinning inside the kernels — worker-placement evidence is
# not-applicable for this lab, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
