#!/usr/bin/env bash
# Evidence configuration: memory-mapped-files (docs/linux-evidence-runner.md).
# Correctness (checksum equality over the shared fixed-record fixture for
# every variant) is checked by both languages' test suites before this
# runner ever executes. Single-threaded, single-CPU benchmark (no
# contention/scaling axis) — the variant axis is one JMH method per
# access pattern, selected via the standard method-exclusion pattern.
# Java/JMH is the measured side for the runner; the Rust/Criterion track
# is a separate instrument run locally (cargo bench) and never merged
# into one ranking with JMH. Genuine cold-vs-warm page-cache
# disambiguation via posix_fadvise(POSIX_FADV_DONTNEED) is native-Linux
# only — see theory.md's Assumptions and scope; this conf does not
# attempt to force page-cache eviction itself.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/memory-mapped-files/code/java"
LAB_RUST_DIR="content/labs/memory-mapped-files/code/rust"
EV_SELECTOR="pl.kzybala.lab.mmap.MmapBenchmark"
LAB_C2C_REQUIRED=0
# Page-fault/read-bandwidth claims come from perf stat page-fault counters
# (see exercises.md) — no cache-line-ownership evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_mmap_methods() {
  echo "bufferedRead warmMmapSequentialRead coldMappedSequentialRead randomMappedAccess mappedWriteAndFlush"
}

lab_variants() {
  _mmap_methods
}

_mmap_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_mmap_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  echo "-e '\\.($(_mmap_exclusions "$1"))\$'"
}

lab_threads() {
  echo "1"
}

lab_cpu_count() {
  echo "1"
}

# No worker-CPU pinning inside the kernels — worker-placement evidence is
# not-applicable for this lab, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
