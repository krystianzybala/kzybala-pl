#!/usr/bin/env bash
# Evidence configuration: deterministic-low-latency-pipeline
# (docs/linux-evidence-runner.md). Correctness (produced ==
# delivered+dropped+restartLoss, checksum parity between NAIVE and
# OPTIMIZED whenever nothing is dropped) is checked by both languages'
# test suites before this runner ever executes. Java/JMH (one class,
# DllpBenchmark, one exclusion per benchmark method) is the measured side
# for the runner; the Rust/Criterion track is a separate instrument run
# locally (cargo bench) and never merged into one ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_quad"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
# The correctness fixture's deterministic simulator is single-threaded;
# the real optimized pipeline shards across 4 single-writer workers, so
# 4 cores are reserved for the eventual real-threaded evidence harness.
LAB_CPUS_EXACT=4
LAB_MIN_CPUS=4
LAB_JAVA_DIR="content/labs/deterministic-low-latency-pipeline/code/java"
LAB_RUST_DIR="content/labs/deterministic-low-latency-pipeline/code/rust"
EV_SELECTOR="pl.kzybala.lab.dllp.DllpBenchmark"
LAB_C2C_REQUIRED=0
# This capstone's mechanism spans scheduling/allocation/queueing — a
# perf-stat/JFR-allocation question, no c2c evidence needed for the
# deterministic-simulator layer measured today.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_dllp_all_methods() {
  echo "naiveObjectQueue optimized overloadProfile faultRestartProfile"
}

lab_variants() {
  _dllp_all_methods
}

_dllp_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_dllp_all_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  echo "-e '\\.($(_dllp_exclusions "$1"))\$'"
}

lab_threads() {
  echo 4
}

lab_cpu_count() {
  echo 4
}

# No explicit worker-CPU pinning inside the deterministic-simulator
# kernels measured today (single-threaded bookkeeping, not cache/NUMA
# placement) — CPUs are reserved by the runner for isolation, not
# consumed via -Dplab.cpu* properties the benchmark itself reads.
# Worker-placement evidence is therefore not-applicable for this lab at
# its current maturity, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
