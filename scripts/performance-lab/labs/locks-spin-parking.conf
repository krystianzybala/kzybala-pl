#!/usr/bin/env bash
# Evidence configuration: locks-spin-parking (docs/linux-evidence-runner.md).
# Correctness (exact shared-counter total for every variant) is checked
# by both languages' test suites before this runner ever executes.
# Java/JMH (one class, LocksBenchmark, one exclusion per variant method)
# is the measured side for the runner; the Rust/Criterion track is a
# separate instrument run locally (cargo bench) and never merged into
# one ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_quad"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
# Exact cardinality: the largest wired worker count is WORKER_COUNT=4
# (short/long critical section, CAS loop, spin-then-park); the
# uncontended-mutex variant uses a deterministic prefix of 1.
LAB_CPUS_EXACT=4
LAB_MIN_CPUS=4
LAB_JAVA_DIR="content/labs/locks-spin-parking/code/java"
LAB_RUST_DIR="content/labs/locks-spin-parking/code/rust"
EV_SELECTOR="pl.kzybala.lab.locks.LocksBenchmark"
LAB_C2C_REQUIRED=0
# Wait-strategy cost is a perf-stat/perf-sched question (CPU time,
# context switches, CAS retries) — no cache-line-ownership evidence
# needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_locks_all_methods() {
  echo "uncontendedMutex shortContended longCriticalSection casLoop spinThenPark"
}

lab_variants() {
  _locks_all_methods
}

_locks_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_locks_all_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  echo "-e '\\.($(_locks_exclusions "$1"))\$'"
}

lab_threads() {
  case "$1" in
    uncontendedMutex) echo 1 ;;
    *) echo 4 ;;
  esac
}

lab_cpu_count() {
  lab_threads "$1"
}

# No explicit worker-CPU pinning inside these kernels (the mechanism
# under test is wait-strategy cost, not cache/NUMA placement) — CPUs are
# reserved by the runner for isolation, not consumed via -Dplab.cpu*
# properties the benchmark itself reads. Worker-placement evidence is
# therefore not-applicable for this lab, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
