#!/usr/bin/env bash
# Evidence configuration: deoptimization-uncommon-traps
# (docs/linux-evidence-runner.md). JMH's steady-state averaging cannot
# represent this lab's actual phenomenon — a ONE-TIME regime shift mid-
# run — so every variant here is kind=aux, running DeoptTimelineHarness
# directly (the same category of tool content/labs/clocks-latency-
# histograms uses for distribution mechanics a throughput mode would
# distort). Every variant's shift point/exception index/null stride is a
# fixed, documented constant (never randomized); the correctness oracle
# (all five variants sum to the fixture-pinned total) is checked inside
# the harness itself before any timeline is reported. Java is the
# measured side for the runner; the Rust track is a separate instrument
# run locally and expected — not merely permitted — to show a flat
# timeline throughout (rust.md).
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/deoptimization-uncommon-traps/code/java"
LAB_RUST_DIR="content/labs/deoptimization-uncommon-traps/code/rust"
EV_SELECTOR="pl.kzybala.lab.deoptimization.DeoptTimelineHarness"
LAB_C2C_REQUIRED=0
# Deopt/recompilation claims come from the timeline harness's own
# pre/shift/post windows plus HotSpot logs where the host supports
# diagnostic flags; perf stat contributes aggregate instructions/cycles/
# context for the run as a whole.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,branches,branch-misses,cache-references,cache-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<dataset short code>
lab_variants() {
  local variants="" variant dataset
  for variant in stable shift exception subtype nullshift; do
    for dataset in strategy parsing validation; do
      variants="${variants} ${variant}-${dataset}"
    done
  done
  echo "$variants"
}

lab_variant_kind() {
  echo "aux"
}

_dut_parts() { # <variant> -> "fullVariant fullDataset"
  local v="$1"
  local variant="${v%%-*}"
  local dataset="${v#*-}"
  case "$variant" in
    stable) variant="stableTypeProfile" ;;
    shift) variant="profileShiftAfterWarmup" ;;
    exception) variant="rareExceptionPath" ;;
    subtype) variant="lateSubtypeLoading" ;;
    nullshift) variant="nullabilityShift" ;;
  esac
  case "$dataset" in
    strategy) dataset="strategyDispatch" ;;
    parsing) dataset="parsingMixedRecords" ;;
    validation) dataset="rareValidationFailure" ;;
  esac
  echo "$variant $dataset"
}

lab_jmh_args() {
  echo ""
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_aux_evidence_cmd() {
  read -r variant dataset <<<"$(_dut_parts "$1")"
  echo "java -Xms1g -Xmx1g -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -cp target/benchmarks.jar pl.kzybala.lab.deoptimization.DeoptTimelineHarness --variant ${variant} --dataset ${dataset}"
}

lab_rust_evidence_cmd() {
  echo ""
}
