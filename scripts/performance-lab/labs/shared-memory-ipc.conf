#!/usr/bin/env bash
# Evidence configuration: shared-memory-ipc (docs/linux-evidence-runner.md).
# Correctness (round-trip delivery + protocol-version rejection + batch
# delivery + a REAL cross-process integration test spawning separate OS
# processes, not same-process threads) is checked by both languages'
# test suites before this runner ever executes. Single-threaded,
# single-CPU JMH benchmark process (the shared-memory variants under
# measurement use two independent mappings within the JMH process itself;
# the real cross-process proof lives in the correctness suite, not this
# throughput benchmark — see theory.md's "Cross-process proof vs. the
# same-process-threads trap"). Java/JMH is the measured side for the
# runner; the Rust/Criterion track is a separate instrument run locally
# (cargo bench) and never merged into one ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/shared-memory-ipc/code/java"
LAB_RUST_DIR="content/labs/shared-memory-ipc/code/rust"
EV_SELECTOR="pl.kzybala.lab.shmipc.ShmIpcBenchmark"
LAB_C2C_REQUIRED=0
# One-way/round-trip latency claims come from the custom process harness
# plus HdrHistogram-style percentile evidence (see exercises.md) — perf
# stat only, no cache-line-ownership evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_shmipc_methods() {
  echo "socketBaseline sharedMemoryCopyPayload sharedMemorySlotView sharedMemoryBatched"
}

_shmipc_profiles() {
  echo "small32Byte medium128Byte large1KiB"
}

lab_variants() {
  local variants="" method profile
  for method in $(_shmipc_methods); do
    for profile in $(_shmipc_profiles); do
      variants="${variants} ${method}-${profile}"
    done
  done
  echo "$variants"
}

_shmipc_method() { # <variant> -> <@Benchmark method name>
  echo "${1%-*}"
}

_shmipc_profile() { # <variant> -> <profile>
  echo "${1##*-}"
}

_shmipc_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_shmipc_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  local method profile
  method="$(_shmipc_method "$1")"
  profile="$(_shmipc_profile "$1")"
  echo "-p profile=${profile} -e '\\.($(_shmipc_exclusions "$method"))\$'"
}

lab_threads() {
  echo "1"
}

lab_cpu_count() {
  echo "1"
}

# No worker-CPU pinning inside the kernels — worker-placement evidence is
# not-applicable for this lab, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
