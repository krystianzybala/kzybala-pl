#!/usr/bin/env bash
# Evidence configuration: udp-ingest-batching (docs/linux-evidence-runner.md).
# Correctness (every sent datagram accounted for as delivered/
# application-dropped/corrupted, exercised with both ample and
# deliberately undersized bounded capacity) is checked by both languages'
# test suites before this runner ever executes. Single-threaded,
# single-CPU JMH benchmark process (the receive loop and its handoff
# consumer thread run within one process; the load generator runs as a
# background thread, not a separate process — see java.md/rust.md).
# Java/JMH is the measured side for the runner; the Rust/Criterion track
# is a separate instrument run locally (cargo bench) and never merged
# into one ranking with JMH. The "batched Linux receive" variant is
# capability-unavailable on this host (and every host this lab currently
# supports) — see theory.md's "Batched receive (recvmmsg)" section — and
# is therefore not one of the wired variants below.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/udp-ingest-batching/code/java"
LAB_RUST_DIR="content/labs/udp-ingest-batching/code/rust"
EV_SELECTOR="pl.kzybala.lab.udpingest.UdpIngestBenchmark"
LAB_C2C_REQUIRED=0
# Drop-rate/queue-depth claims come from the custom load-generator
# harness plus HdrHistogram-style percentile evidence and kernel ss/netstat
# counters (see exercises.md) — perf stat only, no cache-line-ownership
# evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_udpingest_methods() {
  echo "onePacketPerReceive reusedDirectBuffer copyingHandoff zeroCopyViewHandoff"
}

_udpingest_profiles() {
  echo "small64Byte medium256Byte large1400Byte"
}

lab_variants() {
  local variants="" method profile
  for method in $(_udpingest_methods); do
    for profile in $(_udpingest_profiles); do
      variants="${variants} ${method}-${profile}"
    done
  done
  echo "$variants"
}

_udpingest_method() { # <variant> -> <@Benchmark method name>
  echo "${1%-*}"
}

_udpingest_profile() { # <variant> -> <profile>
  echo "${1##*-}"
}

_udpingest_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_udpingest_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  local method profile
  method="$(_udpingest_method "$1")"
  profile="$(_udpingest_profile "$1")"
  echo "-p profile=${profile} -e '\\.($(_udpingest_exclusions "$method"))\$'"
}

lab_threads() {
  echo "1"
}

lab_cpu_count() {
  echo "1"
}

# No worker-CPU pinning inside the kernels — worker-placement evidence is
# not-applicable for this lab, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
