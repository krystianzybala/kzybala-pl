#!/usr/bin/env bash
# Evidence configuration: cache-locality-working-set
# (docs/linux-evidence-runner.md). Every variant's payload is values[i]=i
# (no RNG needed for the payload; only the traversal ORDER differs), so
# the n*(n-1)/2 correctness oracle is checked in @Setup before any
# timing, per (variant, workingSet) cell, and re-verified by both
# languages' unit test suites before this runner ever executes. Working
# sets are sized against the DETECTED cache topology, never a hardcoded
# byte count (same convention as content/labs/cache-hierarchy). Java/JMH
# is the measured side for the runner; the Rust/Criterion track is a
# separate instrument run locally and never merged into one ranking with
# JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_single"
LAB_RUNTIME_CLASS="long"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
LAB_CPUS_EXACT=1
LAB_MIN_CPUS=1
LAB_JAVA_DIR="content/labs/cache-locality-working-set/code/java"
LAB_RUST_DIR="content/labs/cache-locality-working-set/code/rust"
EV_SELECTOR="pl.kzybala.lab.cachelocality.CacheLocalityLinuxEvidenceBenchmark"
LAB_C2C_REQUIRED=0
# Cache-level claims come from LLC/dTLB counters (LAB_PERF_EVENTS below),
# not from cache-line-ownership/HITM evidence — perf stat only.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1
LAB_PERF_EVENTS="cycles,instructions,cache-references,cache-misses,LLC-loads,LLC-load-misses,dTLB-load-misses,branches,branch-misses,task-clock,context-switches,cpu-migrations,page-faults"

# variant name = <variant short code>-<workingSet>
lab_variants() {
  local variants="" variant workingSet
  for variant in seq rand chase blocked; do
    for workingSet in l1 l2 llc 2xllc large; do
      variants="${variants} ${variant}-${workingSet}"
    done
  done
  echo "$variants"
}

_clw_parts() { # <variant> -> "fullVariant workingSet"
  local v="$1"
  local variant="${v%%-*}"
  local workingSet="${v#*-}"
  case "$variant" in
    seq) variant="sequential" ;;
    rand) variant="random" ;;
    chase) variant="pointerChase" ;;
    blocked) variant="blocked" ;;
  esac
  echo "$variant $workingSet"
}

lab_jmh_args() {
  read -r variant workingSet <<<"$(_clw_parts "$1")"
  echo "-p variant=${variant} -p workingSet=${workingSet}"
}

lab_threads() {
  echo 1
}

lab_cpu_count() {
  echo 1
}

lab_worker_props() {
  echo "-Dplab.cpuA=${CPU_LIST[0]}"
}

lab_rust_evidence_cmd() {
  echo ""
}
