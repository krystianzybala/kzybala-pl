#!/usr/bin/env bash
# Evidence configuration: cpu-affinity-numa-irq (docs/linux-evidence-runner.md).
# Correctness (checksum independent of placement, for every target x
# dataset pair) is checked by both languages' test suites before this
# runner ever executes. Java/JMH (one class, AffinityBenchmark, one
# exclusion per benchmark method) is the measured side for the runner;
# the Rust/Criterion track is a separate instrument run locally (cargo
# bench) and never merged into one ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_quad"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
# The runner reserves 4 CPUs so the lab's own Topology probe has an
# isolated core, an SMT sibling candidate and (host-topology permitting)
# same/remote NUMA candidates to resolve from within the reserved set.
LAB_CPUS_EXACT=4
LAB_MIN_CPUS=4
LAB_JAVA_DIR="content/labs/cpu-affinity-numa-irq/code/java"
LAB_RUST_DIR="content/labs/cpu-affinity-numa-irq/code/rust"
EV_SELECTOR="pl.kzybala.lab.cpuaffinity.AffinityBenchmark"
LAB_C2C_REQUIRED=0
# Migration/placement evidence is a perf-stat/topology question, not
# cache-line ownership — no c2c evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_affinity_all_methods() {
  echo "unpinnedMemoryScan pinnedIsolatedCoreMemoryScan smtSiblingsSpscHandoff sameNumaNodeUdpIngest remoteNumaNodeUdpIngest"
}

lab_variants() {
  _affinity_all_methods
}

_affinity_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_affinity_all_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  echo "-e '\\.($(_affinity_exclusions "$1"))\$'"
}

lab_threads() {
  echo 4
}

lab_cpu_count() {
  echo 4
}

# This lab's own kernel performs the pinning (sched_setaffinity via FFM/
# libc) using topology it discovers itself — it does not read a
# -Dplab.cpu* property from the runner. Worker-placement evidence is
# therefore not-applicable for the generic runner-driven pinning gate,
# not a missing artifact; the lab's own AffinityBenchmark result records
# whether ITS pin attempt succeeded.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
