#!/usr/bin/env bash
# Evidence configuration: mpsc-contention (docs/linux-evidence-runner.md).
# Correctness (exact per-producer FIFO order and exact total count for
# every variant) is checked by both languages' test suites before this
# runner ever executes; producer-count scaling (2/4/8/physical-core) is
# derived from the validated CPU set size at measurement time — never
# hardcoded — the same pattern as cas-contention.conf's contender sweep.
# Java/JMH (one class, MpscBenchmark, `-p producers=N` plus one exclusion
# per variant method) is the measured side for the runner; the
# Rust/Criterion track is a separate instrument run locally (cargo bench)
# and never merged into one ranking with JMH.
LAB_CONF_VERSION=1
LAB_BENCHMARK_READY=1
LAB_LANGUAGES="java"
LAB_CPU_SET_REQUIREMENT="core_octet"
LAB_RUNTIME_CLASS="standard"
LAB_COOLDOWN_CLASS="standard"
LAB_IMPORT_SUPPORTED=1
# Exact cardinality: reserve the largest wired producer count (8) up
# front, same pattern as cas-contention.conf — smaller-thread variants
# (2, 4) use a deterministic prefix of the reserved set, derived by
# _mpsc_producer_counts from the live, validated CPU set size.
LAB_CPUS_EXACT=8
LAB_MIN_CPUS=8
LAB_JAVA_DIR="content/labs/mpsc-contention/code/java"
LAB_RUST_DIR="content/labs/mpsc-contention/code/rust"
EV_SELECTOR="pl.kzybala.lab.mpsc.MpscBenchmark"
LAB_C2C_REQUIRED=0
# Contention cost is a perf-stat/JMH question (CAS-failure counts,
# cycles per op) — no cache-line-ownership evidence needed.
LAB_PROFILER_POLICY="stat"
LAB_REPRODUCTIONS_REQUIRED=1

_mpsc_all_methods() {
  echo "sharedMpsc batchedClaim perProducerFanIn mutexQueue libraryQueue"
}

# Producer counts are derived from the validated CPU set size — "8/
# physical-core producers where the selected physical CPU set supports
# it", never a hardcoded logical CPU number.
_mpsc_producer_counts() {
  local n=${#CPU_LIST[@]}
  local counts="2"
  [ "$n" -ge 4 ] && counts="$counts 4"
  [ "$n" -ge 8 ] && counts="$counts 8"
  echo "$counts"
}

lab_variants() {
  local variants="" method count
  for method in $(_mpsc_all_methods); do
    for count in $(_mpsc_producer_counts); do
      variants="${variants} ${method}-${count}"
    done
  done
  echo "$variants"
}

_mpsc_method() { # <variant> -> <@Benchmark method name>
  echo "${1%-*}"
}

_mpsc_count() { # <variant> -> <producer count>
  echo "${1##*-}"
}

_mpsc_exclusions() { # <kept method> -> alternation of every other method
  local kept="$1" all out="" m
  all="$(_mpsc_all_methods)"
  for m in $all; do
    [ "$m" = "$kept" ] && continue
    out="${out}|${m}"
  done
  echo "${out#|}"
}

lab_jmh_args() {
  local method count
  method="$(_mpsc_method "$1")"
  count="$(_mpsc_count "$1")"
  echo "-p producers=${count} -e '\\.($(_mpsc_exclusions "$method"))\$'"
}

lab_threads() {
  _mpsc_count "$1"
}

lab_cpu_count() {
  _mpsc_count "$1"
}

# No explicit worker-CPU pinning inside these kernels (the mechanism
# under test is claim-point contention, not cache/NUMA placement) — CPUs
# are reserved by the runner for isolation, not consumed via -Dplab.cpu*
# properties the benchmark itself reads. Worker-placement evidence is
# therefore not-applicable for this lab, not a missing artifact.
lab_worker_props() {
  echo ""
}

lab_rust_evidence_cmd() {
  echo ""
}
