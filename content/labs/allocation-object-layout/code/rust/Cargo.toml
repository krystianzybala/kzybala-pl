[package]
name = "allocation-object-layout-lab"
version = "0.1.0"
edition = "2021"
description = "Companion code for the Performance Lab \"Allocation cost and object layout\" lab (kzybala.pl/lab/allocation-object-layout/)."
publish = false

[lib]
name = "allocation_object_layout_lab"
path = "src/lib.rs"

[dependencies]
# Worker affinity for the native-Linux evidence binary only.
libc = "0.2"

[dev-dependencies]
criterion = "0.5"

# cargo bench always builds this profile (inherits release). Benchmarking
# a debug build is invalid input for this lab by definition.
[profile.bench]
inherits = "release"

[[bench]]
name = "allocation_object_layout"
harness = false
