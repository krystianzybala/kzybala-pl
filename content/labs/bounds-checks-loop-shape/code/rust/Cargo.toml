[package]
name = "bounds-checks-loop-shape-lab"
version = "0.1.0"
edition = "2021"
description = "Companion code for the Performance Lab \"Bounds checks and loop shape\" lab (kzybala.pl/lab/bounds-checks-loop-shape/)."
publish = false

[lib]
name = "bounds_checks_lab"
path = "src/lib.rs"

[dependencies]
# Worker affinity for the native-Linux evidence binary only.
libc = "0.2"

[dev-dependencies]
criterion = "0.5"

# cargo bench always builds this profile (inherits release). Benchmarking
# a debug build is invalid input for this lab by definition.
[profile.bench]
inherits = "release"

[[bench]]
name = "bounds_checks"
harness = false
