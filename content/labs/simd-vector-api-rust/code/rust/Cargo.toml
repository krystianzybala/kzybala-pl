[package]
name = "simd-vector-api-rust-lab"
version = "0.1.0"
edition = "2021"
description = "Companion code for the Performance Lab \"SIMD: Java Vector API and Rust\" lab (kzybala.pl/lab/simd-vector-api-rust/)."
publish = false

[lib]
name = "simd_vector_api_rust_lab"
path = "src/lib.rs"

[dependencies]
# Worker affinity for the native-Linux evidence binary only.
libc = "0.2"

[dev-dependencies]
criterion = "0.5"

# cargo bench always builds this profile (inherits release). Benchmarking
# a debug build is invalid input for this lab by definition.
[profile.bench]
inherits = "release"

[[bench]]
name = "simd_vector_api_rust"
harness = false
