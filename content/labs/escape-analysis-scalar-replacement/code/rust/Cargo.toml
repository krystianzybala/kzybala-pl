[package]
name = "escape-analysis-scalar-replacement-lab"
version = "0.1.0"
edition = "2021"
description = "Companion code for the Performance Lab \"Escape analysis and scalar replacement\" lab (kzybala.pl/lab/escape-analysis-scalar-replacement/)."
publish = false

[lib]
name = "escape_analysis_lab"
path = "src/lib.rs"

[dependencies]
# Worker affinity for the native-Linux evidence binary only.
libc = "0.2"

[dev-dependencies]
criterion = "0.5"

# cargo bench always builds this profile (inherits release). Benchmarking
# a debug build is invalid input for this lab by definition.
[profile.bench]
inherits = "release"

[[bench]]
name = "escape_analysis"
harness = false
