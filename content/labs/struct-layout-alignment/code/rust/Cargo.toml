[package]
name = "struct-layout-alignment-lab"
version = "0.1.0"
edition = "2021"
description = "Companion code for the Performance Lab \"Struct layout, alignment and padding\" lab (kzybala.pl/lab/struct-layout-alignment/)."
publish = false

[lib]
name = "struct_layout_alignment_lab"
path = "src/lib.rs"

[dependencies]
# Worker affinity for the native-Linux evidence binary only.
libc = "0.2"

[dev-dependencies]
criterion = "0.5"

# cargo bench always builds this profile (inherits release). Benchmarking
# a debug build is invalid input for this lab by definition.
[profile.bench]
inherits = "release"

[[bench]]
name = "struct_layout_alignment"
harness = false
