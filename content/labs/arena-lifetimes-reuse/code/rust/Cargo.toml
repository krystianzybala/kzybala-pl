[package]
name = "arena-lifetimes-reuse-lab"
version = "0.1.0"
edition = "2021"
description = "Companion code for the Performance Lab \"Arena lifetimes, pools and reuse\" lab (kzybala.pl/lab/arena-lifetimes-reuse/)."
publish = false

[lib]
name = "arena_lifetimes_reuse_lab"
path = "src/lib.rs"

[dependencies]
# Worker affinity for the native-Linux evidence binary only.
libc = "0.2"

[dev-dependencies]
criterion = "0.5"

# cargo bench always builds this profile (inherits release). Benchmarking
# a debug build is invalid input for this lab by definition.
[profile.bench]
inherits = "release"

[[bench]]
name = "arena_lifetimes_reuse"
harness = false
