[package]
name = "shared-memory-ipc-lab"
version = "0.1.0"
edition = "2021"

[lib]
name = "shared_memory_ipc_lab"
path = "src/lib.rs"

[[bin]]
name = "producer"
path = "src/bin/producer.rs"

[[bin]]
name = "consumer"
path = "src/bin/consumer.rs"

[[bench]]
name = "shared_memory_ipc"
harness = false

[dependencies]
memmap2 = "0.9"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[profile.bench]
inherits = "release"
